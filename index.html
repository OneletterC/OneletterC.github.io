<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Cipher</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:20px auto;padding:10px}
input,select,textarea,button{width:100%;margin:5px 0;padding:8px;box-sizing:border-box}
.buttons{display:flex;gap:6px;flex-wrap:wrap}
.buttons button{flex:1}
#gridModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4)}
#gridBox{background:white;margin:40px auto;padding:15px;width:max-content}
.grid{display:grid;gap:2px}
.cell{border:1px solid #000;padding:6px;min-width:22px;text-align:center}
</style>
</head>
<body>
<h2>Custom Cipher</h2>

<label>Keyword</label>
<input id="keyword">

<label>Grid Size</label>
<select id="grid">
<option>3x9</option>
<option>9x3</option>
<option>4x7</option>
<option>7x4</option>
<option>5x6</option>
<option selected>6x5</option>
</select>

<textarea id="input" rows="6"></textarea>

<div class="buttons">
<button onclick="encode()">Encode</button>
<button onclick="decode()">Decode</button>
<button onclick="showGrid()">Show Grid</button>
<button onclick="copyOutput()">Copy Output</button>
<button onclick="clearAll()">Clear</button>
</div>

<textarea id="output" rows="6"></textarea>

<div id="gridModal" onclick="this.style.display='none'">
  <div id="gridBox" onclick="event.stopPropagation()">
    <div id="gridView"></div>
  </div>
</div>

<script>
function buildGrid(keyword, rows, cols){
    keyword=(keyword.toLowerCase().match(/[a-z]/g)||[]).join('');
    let seen=new Set(), chars=[];
    for(const ch of keyword){ if(!seen.has(ch)){ seen.add(ch); chars.push(ch);}}
    for(const ch of "abcdefghijklmnopqrstuvwxyz"){ if(!seen.has(ch)) chars.push(ch); }
    chars=chars.slice(0,26);

    let c2c={}, coord2={};
    let idx=0;
    for(let r=1;r<=rows;r++){
        for(let c=1;c<=cols;c++){
            if(idx<26){
                const coord=`${r}${c}`;
                c2c[chars[idx]]=coord;
                coord2[coord]=chars[idx];
                idx++;
            }
        }
    }
    return {chars,c2c,coord2};
}

function encodeText(keyword,text,rows,cols){
    const {c2c}=buildGrid(keyword,rows,cols);
    let out=`${rows}${cols}`;
    for(const word of text.toLowerCase().trim().split(/\s+/)){
        out+=String(word.length);
        for(const ch of word){
            if(c2c[ch]) out+=c2c[ch];
        }
    }
    return out;
}

function decodeText(keyword,cipher){
    const rows=parseInt(cipher[0]), cols=parseInt(cipher[1]);
    const {coord2}=buildGrid(keyword,rows,cols);
    let pos=2, words=[];
    while(pos<cipher.length){
        const n=parseInt(cipher[pos++]);
        let w="";
        for(let i=0;i<n;i++){
            const coord=cipher.slice(pos,pos+2);
            pos+=2;
            w+=coord2[coord] || "?";
        }
        words.push(w);
    }
    return words.join(" ");
}

function encode(){
    const [r,c]=document.getElementById('grid').value.split('x').map(Number);
    const plaintext=document.getElementById('input').value.trim();
    let result=encodeText(document.getElementById('keyword').value, plaintext, r, c);

    try{
        const decoded=decodeText(document.getElementById('keyword').value, result);
        const original=plaintext.toLowerCase().split(/\s+/)
          .map(w=>w.replace(/[^a-z]/g,''))
          .filter(Boolean).join(' ');

        if(decoded!==original) result="ERROR: Verification Failed";
    }catch(e){
        result="ERROR: Verification Failed";
    }

    document.getElementById('output').value=result;
}

function decode(){
    document.getElementById('output').value=decodeText(
        document.getElementById('keyword').value,
        document.getElementById('input').value.trim()
    );
}

function copyOutput(){
    navigator.clipboard.writeText(document.getElementById('output').value);
}

function clearAll(){
    document.getElementById('input').value='';
    document.getElementById('output').value='';
}

function showGrid(){
    const [r,c]=document.getElementById('grid').value.split('x').map(Number);
    const {chars}=buildGrid(document.getElementById('keyword').value,r,c);
    const gv=document.getElementById('gridView');
    gv.className='grid';
    gv.style.gridTemplateColumns=`repeat(${c},auto)`;
    gv.innerHTML='';
    let idx=0;
    for(let row=0;row<r;row++){
        for(let col=0;col<c;col++){
            const d=document.createElement('div');
            d.className='cell';
            d.textContent=idx<26?chars[idx]:'';
            gv.appendChild(d);
            idx++;
        }
    }
    document.getElementById('gridModal').style.display='block';
}
</script>
</body>
</html>
